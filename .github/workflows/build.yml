name: Build Ben Bocaz Studio Pro (AU)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos-au:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6

      - name: Convert Assets to Standard PNG
        shell: bash
        run: |
          if [ -d "Assets" ]; then
            shopt -s nullglob nocaseglob
            for f in Assets/*.jpg Assets/*.jpeg Assets/*.png Assets/*.webp Assets/*.heic; do
              base="${f%.*}"
              sips -s format png -Z 1600 "$f" --out "${base}_clean.png"
              rm -f "$f"
              mv "${base}_clean.png" "${base}.png"
            done
            ls -lh Assets
          fi

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64"

      - name: Build AU Plugin
        run: cmake --build build --config Release --target BenBocazStudioPro_AU --parallel

      - name: Ad-Hoc Codesign AU
        run: codesign --force --deep --sign - "build/BenBocazStudioPro_artefacts/Release/AU/Ben Bocaz Studio Pro.component"

      - name: Upload AU Artifact
        uses: actions/upload-artifact@v6
        with:
          name: BenBocazStudioPro-AU
          path: build/BenBocazStudioPro_artefacts/Release/AU/Ben Bocaz Studio Pro.component
